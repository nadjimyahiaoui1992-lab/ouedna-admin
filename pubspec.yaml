name: ouedna_admin
description: "لوحة التحكم الرسمية لمنظومة وادنا لإدارة المعالم ومحتوى المجتمع."
publish_to: 'none'

version: 2.0.4+23

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.3.2
  package_info_plus: ^8.1.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dependency_overrides:
  app_links: 6.3.3
  geolocator_android: 4.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
