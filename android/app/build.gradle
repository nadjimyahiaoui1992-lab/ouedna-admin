plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Les identifiants de signature restent hors du dépôt et sont lus uniquement
// depuis OUEDNA_KEYSTORE_PATH, OUEDNA_KEY_ALIAS, OUEDNA_STORE_PASSWORD et
// OUEDNA_KEY_PASSWORD, comme pour l’application visiteur.
def releaseStorePath = System.getenv("OUEDNA_KEYSTORE_PATH")
def releaseKeyAlias = System.getenv("OUEDNA_KEY_ALIAS")
def releaseStorePassword = System.getenv("OUEDNA_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("OUEDNA_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseStorePath,
    releaseKeyAlias,
    releaseStorePassword,
    releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }
def requestsReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

android {
    namespace = "com.ouedna.admin.v2"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ouedna.admin.v2"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21
        targetSdk = 34
        versionCode = 23
        versionName = "2.0.4"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (requestsReleaseBuild && !hasReleaseSigning) {
                throw new GradleException(
                    "La signature release exige OUEDNA_KEYSTORE_PATH, OUEDNA_KEY_ALIAS, " +
                    "OUEDNA_STORE_PASSWORD et OUEDNA_KEY_PASSWORD."
                )
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
